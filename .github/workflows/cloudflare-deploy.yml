name: Cloudflare deploy

# Lint, typecheck, test, build and deploy a site to Cloudflare Workers.

on:
  workflow_call:
    inputs:
      build-env:
        description: Extra environment variables for the build, one KEY=value per line. Not for secrets.
        type: string
        default: ''
      cache-path:
        description: Build output to cache between runs, e.g. generated images.
        type: string
        default: ''
      cache-files:
        description: Space-separated paths whose change discards the cache.
        type: string
        default: ''

env:
  # For repos without wrangler as a dependency.
  WRANGLER_VERSION: 4.155.0

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A newer run on the same branch cancels the running one.
    concurrency:
      group: cloudflare-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outputs which steps to run; fails on missing required files or scripts.
      - name: Detect project
        id: project
        run: |
          if [ ! -f .node-version ]; then
            echo "::error::.node-version is required"
            exit 1
          fi

          # No package.json: plain static site, skip straight to deploy.
          if [ ! -f package.json ]; then
            echo "npm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required, use npm"
            exit 1
          fi
          echo "npm=true" >> "$GITHUB_OUTPUT"

          for script in lint typecheck test build; do
            if jq -e --arg s "$script" '.scripts[$s]' package.json > /dev/null; then
              echo "$script=true" >> "$GITHUB_OUTPUT"
            elif [ "$script" = lint ] || [ "$script" = build ]; then
              echo "::error::package.json needs a \"$script\" script"
              exit 1
            fi
          done

      # Caches npm downloads only for npm projects.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ steps.project.outputs.npm == 'true' && 'npm' || '' }}

      - if: steps.project.outputs.npm == 'true'
        run: npm ci

      - if: steps.project.outputs.lint == 'true'
        run: npm run lint

      - if: steps.project.outputs.typecheck == 'true'
        run: npm run typecheck

      - if: steps.project.outputs.test == 'true'
        run: npm test

      # Hashes the git blob ids of cache-files into the cache key.
      - name: Compute cache key
        id: cache-key
        if: inputs.cache-path != ''
        env:
          CACHE_FILES: ${{ inputs.cache-files }}
        run: |
          read -ra files <<< "$CACHE_FILES"
          echo "key=build-cache-$(git ls-files -s -- "${files[@]}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ steps.cache-key.outputs.key }}

      # Exports each KEY=value line of build-env, for this step only.
      - if: steps.project.outputs.build == 'true'
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "${line?}"
          done <<< "$BUILD_ENV"
          npm run build

      # Main only; prefers the repo's own wrangler.
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -x node_modules/.bin/wrangler ]; then
            npx wrangler deploy
          else
            npx --yes "wrangler@$WRANGLER_VERSION" deploy
          fi
